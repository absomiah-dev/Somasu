# Somasu on Netlify. The web app is in public/; the server functions are in
# netlify/functions. Netlify installs package.json (web-push) when it builds.
[build]
  publish = "public"
  functions = "netlify/functions"

# Fix the Node version (the engine that runs the server functions) to the one every Somasu
# test runs on, so a Netlify default change can't alter it without us knowing (26 R8).
[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/config.js"
  [headers.values]
    Cache-Control = "no-cache"
