<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<!-- Security rule (26 R12): the browser only runs scripts from Somasu itself and the Supabase
     library on jsDelivr. Anything else is blocked, including scripts slipped into the page and
     Netlify's injected "Powered by Netlify" badge (Netlify documents this effect). -->
<meta http-equiv="Content-Security-Policy" content="script-src 'self' https://cdn.jsdelivr.net; object-src 'none'; base-uri 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#9FBDAA">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Somasu">
<meta name="app-version" content="26 R14 (12-11-2026)">
<title>Somasu</title>
<link rel="manifest" href="site.webmanifest">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  /* Palette (Andy, 05-11-2026): Moringa #9FBDAA (primary), Butter #F7DAA1, Blush #E8C3B8, Periwinkle #B8C0ED.
     The pastels are used for surfaces; text and small marks use the deeper shades so they stay readable.
     Variable names are kept from the first design (--gold is now the primary moringa) so nothing else had to move. */
  --gold:#9FBDAA; --gold-deep:#8DAF9A; --gold-tint:#F7DAA1; --gold-soft:#FDF4E3;
  --ink:#1D3328; --muted:#56655C; --green:#3B6A50; --green-tint:#E2EDE6;
  --indigo:#5361C2; --indigo-tint:#DCE0F8; --ivory:#F3F6F1; --white:#fff;
  --line:#DCE4DC; --danger:#B3261E; --danger-tint:#F7E1DB;
  --butter:#F7DAA1; --blush:#E8C3B8; --peri:#B8C0ED; --moringa:#9FBDAA;
  --radius:16px; --shadow:0 1px 2px rgba(29,51,40,.06),0 4px 16px rgba(29,51,40,.06);
  --nav-h:68px; --top-h:60px;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--ivory);color:var(--ink);font-family:Sora,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--green)}
h1,h2,h3{margin:0;line-height:1.2}
.hidden{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- shell ---------- */
.top{position:sticky;top:0;z-index:20;background:var(--gold);padding:calc(var(--safe-t) + 10px) 16px 10px;display:flex;align-items:center;gap:10px;min-height:var(--top-h)}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;letter-spacing:-.01em;background:none;border:0;padding:0}
.brand img{width:34px;height:34px;border-radius:9px;box-shadow:0 0 0 2px rgba(255,255,255,.7),0 1px 3px rgba(29,51,40,.18)}
.brand small{display:block;font-weight:500;font-size:11px;letter-spacing:.02em;color:var(--ink);opacity:.75;margin-top:1px}
.top .spacer{flex:1}
.mode-pill{font-size:11px;font-weight:600;background:rgba(29,51,40,.1);padding:4px 10px;border-radius:99px;white-space:nowrap}
.layout{display:flex;min-height:calc(100vh - var(--top-h))}
.side{display:none}
main{flex:1;min-width:0;padding:16px 16px calc(var(--nav-h) + var(--safe-b) + 90px);max-width:1180px;margin:0 auto;width:100%}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--white);border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + var(--safe-b));}
.nav button{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;border-radius:12px;font-size:11px;font-weight:600;color:var(--muted)}
.nav button svg{width:24px;height:24px}
.nav button.on{color:var(--ink)}
.nav button.on .ico{background:var(--gold);}
.nav .ico{display:grid;place-items:center;width:52px;height:30px;border-radius:99px;transition:background .15s}
@media (min-width:900px){
  .nav{display:none}
  .side{display:flex;flex-direction:column;gap:4px;width:230px;flex:none;padding:18px 12px;position:sticky;top:var(--top-h);height:calc(100vh - var(--top-h));border-right:1px solid var(--line);background:var(--ivory)}
  .side button{display:flex;align-items:center;gap:12px;background:none;border:0;padding:11px 14px;border-radius:12px;font-weight:600;color:var(--ink);text-align:left}
  .side button svg{width:22px;height:22px}
  .side button:hover{background:rgba(29,51,40,.05)}
  .side button.on{background:var(--gold)}
  .side .foot{margin-top:auto;font-size:11px;color:var(--muted);padding:0 14px}
  main{padding:24px 28px 120px}
}
.fab{position:fixed;right:18px;bottom:calc(var(--nav-h) + var(--safe-b) + 16px);z-index:25;width:58px;height:58px;border-radius:18px;border:0;background:var(--ink);color:var(--butter);display:grid;place-items:center;box-shadow:0 6px 20px rgba(29,51,40,.3)}
.fab svg{width:28px;height:28px}
@media (min-width:900px){.fab{bottom:28px;right:28px}}

/* ---------- common ---------- */
.page-h{display:flex;align-items:center;gap:10px;margin:2px 0 14px;flex-wrap:wrap}
.page-h h1{font-size:24px;font-weight:800;letter-spacing:-.02em}
.page-h .sub{color:var(--muted);font-size:13px;width:100%;margin-top:-6px}
.card{background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
.card h2{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px;margin-bottom:10px}
.card h2 .dot{width:9px;height:9px;border-radius:50%;background:var(--gold);flex:none}
.card h2 .more{margin-left:auto;font-size:12px;font-weight:600;background:none;border:0;color:var(--green);padding:4px}
.grid2{display:grid;gap:14px}
.dash{background:linear-gradient(160deg,#1D3328 0%,#2B4A3A 100%);color:#fff;border-radius:22px;padding:16px;margin:0 0 16px;box-shadow:0 8px 24px rgba(29,51,40,.18)}
.dash .hero{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:2px 4px 14px}
.dash .k{display:block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#F7DAA1}
.dash .hero .t{font-size:24px;font-weight:800;line-height:1.15;margin-top:4px;overflow-wrap:anywhere}
.dash .hero .m{font-size:14px;color:rgba(255,255,255,.82);margin-top:3px}
.dash .tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (min-width:700px){.dash .tiles{grid-template-columns:repeat(4,1fr)}}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;min-height:132px;padding:12px;border:0;border-radius:16px;background:rgba(255,255,255,.09);box-shadow:inset 0 0 0 1px rgba(255,255,255,.10);color:#fff;font:inherit;cursor:pointer;min-width:0;position:relative}
.tile .k{font-size:10.5px}
.tile .v{font-size:17px;font-weight:700;line-height:1.2;max-width:100%;margin-top:auto}
.tile .h{font-size:12.5px;color:rgba(255,255,255,.78);line-height:1.3;max-width:100%;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.tile.hot{box-shadow:inset 0 0 0 2px #F7DAA1;background:rgba(247,218,161,.12)}
.tile.hot .h{color:#F7DAA1;font-weight:700}
.tile.setup{background:transparent;box-shadow:inset 0 0 0 2px rgba(255,255,255,.25)}
.tile:focus-visible,.att:focus-visible,.dash-edit:focus-visible{outline:3px solid #F7DAA1;outline-offset:2px}
.tile .vis{display:flex;align-items:center;gap:8px;margin:4px 0 2px}
.ring{width:44px;height:44px;flex:none}.ring text{fill:#fff;font:700 10px Sora,system-ui,sans-serif}
.binic{width:36px;height:36px;flex:none}
.wxi{font-size:30px;line-height:1}.wxt{font-size:13px;color:rgba(255,255,255,.8)}.wxt b{font-size:22px;color:#fff}
.rainbar{display:block;width:100%;height:5px;border-radius:3px;background:rgba(255,255,255,.15);overflow:hidden;margin:2px 0}.rainbar i{display:block;height:100%;background:#8FC7F0;border-radius:3px}
.bars{display:flex;align-items:flex-end;gap:4px;height:46px;width:100%;margin:6px 0 2px}
.bars .bar{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:2px}
.bars .bar i{display:block;width:100%;max-width:14px;border-radius:4px 4px 2px 2px;background:rgba(159,189,170,.75)}
.bars .bar.now i{background:#F7DAA1}.bars .bar em{font-style:normal;font-size:9px;color:rgba(255,255,255,.65);line-height:1}
.strip2{position:relative;display:block;width:100%;height:12px;border-radius:6px;background:rgba(255,255,255,.14);margin:12px 0 6px;overflow:hidden}.strip2 i{position:absolute;top:0;bottom:0;border-radius:4px}.strip2 b{position:absolute;top:-2px;bottom:-2px;width:2px;background:#F7DAA1}
.dash h3{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#F7DAA1;margin:16px 4px 8px}
.att{display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;background:#fff;color:var(--ink);border:0;border-radius:14px;padding:11px 12px;margin-bottom:8px;font:inherit;cursor:pointer}
.att .dot{width:12px;height:12px;border-radius:50%;flex:none;margin-top:4px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.att b{display:block;font-size:14px}.att small{display:block;font-size:12.5px;color:var(--muted);margin-top:1px}
.dash-edit{display:block;margin:10px auto 0;background:none;border:0;color:rgba(255,255,255,.75);font:600 12.5px inherit;font-family:inherit;text-decoration:underline;cursor:pointer;padding:6px}
.wxh{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px}
.wxwarn{display:flex;flex-direction:column;gap:4px;border-left:6px solid;background:#FFF8E6;border-radius:10px;padding:10px 12px;margin-bottom:8px}.wxwarn span{font-size:13.5px}.wxwarn a{font-size:13.5px;font-weight:600;color:var(--ink)}
.wxe{font-size:22px;width:30px;flex:none;text-align:center}
.wxbig{display:flex;align-items:baseline;gap:8px;font-size:40px}.wxbig b{font-size:40px}
.wxbig-l{font-size:14px;font-weight:700;color:var(--muted);margin-left:auto;align-self:center}
.wxdays{border:1px solid var(--line,#E4E1D8);border-radius:14px;overflow:hidden}
.wxd{border-top:1px solid var(--line,#E4E1D8)}.wxd:first-child{border-top:0}
.wxd>summary,.wxd.flat{display:grid;grid-template-columns:minmax(66px,1fr) 30px 54px 30px minmax(50px,1.6fr) 30px 16px;align-items:center;gap:6px;padding:10px 12px;font-size:14.5px;list-style:none;cursor:pointer}
.wxd.flat{grid-template-columns:minmax(66px,1fr) 30px 54px 30px minmax(50px,1.6fr) 30px 16px;cursor:default;color:var(--ink)}
.wxd>summary::-webkit-details-marker{display:none}
.wxd[open]>summary{background:#F3EDE0}
.wxd-n{font-weight:600;white-space:nowrap}.wxd-i{font-size:20px;text-align:center}.wxd-r{font-size:12.5px;color:#2F6EA5}.wxd-r.wet{font-weight:700}
.wxd-lo{text-align:right;color:var(--muted)}.wxd-hi{font-weight:700}
.wxd-c::after{content:"";display:block;width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin:-3px auto 0}
.wxd[open] .wxd-c::after{transform:rotate(-135deg);margin-top:3px}
.wxrange{position:relative;height:6px;border-radius:3px;background:#E9E5DA}.wxrange i{position:absolute;top:0;bottom:0;border-radius:3px;background:linear-gradient(90deg,#7DB3DE,#F2B84C)}
.wxd-b{padding:4px 12px 12px}
.wxhrs{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;padding:4px 0 6px}
.wxhr{min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;background:#F7F5EF;border-radius:10px;padding:7px 0;font-size:12.5px}
.wxhr b{font-size:12px;font-weight:600;color:var(--muted)}.wxhr .ic{font-size:20px}.wxhr .t{font-weight:700;font-size:15px}.wxhr .r{color:#2F6EA5;font-size:12px}.wxhr .r::before{content:"💧";font-size:10px}.wxhr .g{font-size:12px;color:var(--muted)}.wxhr .g::before{content:"💨";font-size:10px}
.wxhr.wet{background:#E3EEF8}
.wxkey{margin-top:2px}
.wxdays.later .wxd{opacity:.92}
@media (max-width:380px){.wxd>summary,.wxd.flat{grid-template-columns:minmax(70px,1fr) 26px 46px 26px minmax(36px,1.2fr) 28px 14px;gap:4px;padding:9px 8px;font-size:13.5px}}
.wxhours{display:flex;align-items:flex-end;gap:6px;height:90px;margin:10px 0}.wxhours span{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px}.wxhours i{display:block;width:100%;background:#5BA4D9;border-radius:4px 4px 2px 2px}.wxhours em{font-style:normal;font-size:11px;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.tile,.att{transition:transform .15s}.tile:active,.att:active{transform:scale(.98)}}
.bindot{display:inline-block;width:14px;height:14px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.18)}
.row2{display:flex;gap:8px}.row2>*{flex:1;min-width:0}
fieldset.f{border:0;padding:0;margin:0 0 14px}fieldset.f legend{font-weight:600;font-size:14px;margin-bottom:6px;padding:0}fieldset.f input+input,fieldset.f .row2+input{margin-top:8px}
@media (min-width:900px){.grid2{grid-template-columns:1fr 1fr}.grid2 .card{margin-bottom:0}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:12px;padding:11px 16px;font-weight:600;background:var(--gold);color:var(--ink);min-height:44px}
.btn:hover{background:var(--gold-deep)}
.btn.dark{background:var(--ink);color:var(--white)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.ghost:hover{background:rgba(29,51,40,.04)}
.btn.danger{background:var(--danger-tint);color:var(--danger)}
.btn.sm{min-height:34px;padding:6px 12px;font-size:13px;border-radius:10px}
.btn svg{width:18px;height:18px}
.icon-btn{width:40px;height:40px;border-radius:12px;border:0;background:transparent;display:grid;place-items:center;color:var(--ink)}
.icon-btn:hover{background:rgba(29,51,40,.06)}
.icon-btn svg{width:22px;height:22px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;margin:0 -2px 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:7px;border:0;border-radius:99px;padding:8px 14px;background:var(--white);font-weight:600;font-size:13px;box-shadow:inset 0 0 0 1.5px var(--line);white-space:nowrap;min-height:38px}
.chip.on{background:var(--ink);color:var(--white);box-shadow:none}
.chip .n{font-size:11px;background:var(--butter);color:var(--ink);border-radius:99px;padding:1px 7px}
.chip .sw{width:10px;height:10px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.chip.off{opacity:.45}
.empty{text-align:center;color:var(--muted);padding:26px 10px;font-size:14px}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}
.muted{color:var(--muted)}
.small{font-size:12px}
.av{width:26px;height:26px;border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-size:11px;font-weight:700;flex:none}
.av.lg{width:40px;height:40px;font-size:15px}
.av-stack{display:inline-flex}
.av-stack .av{width:22px;height:22px;font-size:10px;box-shadow:0 0 0 2px #fff;margin-left:-6px}
.av-stack .av:first-child{margin-left:0}
.av.more{background:#56655C}
.ev>.av-stack{margin-left:auto;align-self:center;flex:none;padding-left:6px}
.ev .src{white-space:nowrap}
.banner{background:var(--gold-soft);border:1px solid var(--gold-tint);border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:14px;display:flex;gap:10px;align-items:flex-start}
.banner b{font-weight:700}

/* ---------- rows ---------- */
.row{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .main{flex:1;min-width:0}
.row .t{font-weight:600;overflow-wrap:anywhere}
.row .m{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.when{flex:none;width:58px;font-size:13px;font-weight:700;text-align:right}
.when small{display:block;font-weight:500;color:var(--muted);font-size:11px}
.evbar{width:4px;align-self:stretch;border-radius:4px;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}

/* ---------- lists ---------- */
.addbar{display:flex;gap:8px;margin-bottom:12px}
.addbar input{flex:1;min-width:0;border:0;border-radius:14px;padding:13px 16px;background:var(--white);box-shadow:var(--shadow), inset 0 0 0 1.5px var(--line);font-size:16px}
.addbar input:focus{outline:none;box-shadow:inset 0 0 0 2px var(--ink)}
.addbar .scanbtn{padding:0 12px;flex:none;background:var(--white);box-shadow:var(--shadow), inset 0 0 0 1.5px var(--line)}
.addbar .scanbtn svg{width:22px;height:22px}
.scanbox{position:relative;border-radius:16px;overflow:hidden;background:#000;aspect-ratio:4/3;margin-bottom:10px}
.scanbox video{width:100%;height:100%;object-fit:cover;display:block}
.scanaim{position:absolute;left:12%;right:12%;top:32%;bottom:32%;border:3px solid rgba(255,255,255,.9);border-radius:12px;box-shadow:0 0 0 999px rgba(0,0,0,.28)}
.scanaim::after{content:"";position:absolute;left:6%;right:6%;top:50%;height:2px;background:#DB2B24;animation:scanline 1.6s ease-in-out infinite alternate}
@keyframes scanline{from{transform:translateY(-28px)}to{transform:translateY(28px)}}
@media (prefers-reduced-motion:reduce){.scanaim::after{animation:none}}
.scanaim.hit{border-color:#22C17A}.scanaim.hit::after{display:none}
.scanrow{display:flex;gap:8px}.scanrow input{flex:1;min-width:0}
.suggest{display:flex;flex-wrap:wrap;gap:6px;margin:-2px 0 14px}
.suggest button{border:0;background:var(--gold-soft);border-radius:99px;padding:6px 12px;font-size:12px;font-weight:600;box-shadow:inset 0 0 0 1px var(--gold-tint)}
.suggest button:hover{background:var(--gold-tint)}
.cat{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:14px 4px 2px}
.cat:first-child{margin-top:0}
.item{display:flex;align-items:center;gap:12px;padding:6px 4px;border-bottom:1px solid var(--line);min-height:52px}
.item:last-child{border-bottom:0}
.tick{width:28px;height:28px;border-radius:50%;border:2px solid #BAC7BC;background:#fff;flex:none;display:grid;place-items:center;padding:0}
.tick svg{width:16px;height:16px;opacity:0}
.item.done .tick{background:var(--green);border-color:var(--green);color:#fff}
.item.done .tick svg{opacity:1}
.item .txt{flex:1;min-width:0;background:none;border:0;text-align:left;padding:6px 0}
.item .txt .t{font-weight:600;display:block;overflow-wrap:anywhere}
.item .txt .m{font-size:12px;color:var(--muted)}
.item.done .txt .t{text-decoration:line-through;color:var(--muted);font-weight:500}
.done-h{display:flex;align-items:center;gap:8px;margin-top:16px}
.done-h button.tog{background:none;border:0;font-weight:700;font-size:13px;display:flex;align-items:center;gap:6px;padding:6px 4px}
.done-h .btn{margin-left:auto}

/* ---------- calendar ---------- */
.cal-h{display:flex;align-items:center;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.cal-h h1{font-size:22px;font-weight:800;margin-right:auto;letter-spacing:-.02em}
.seg{display:inline-flex;background:var(--white);border-radius:12px;padding:3px;box-shadow:inset 0 0 0 1.5px var(--line)}
.seg button{border:0;background:none;padding:6px 12px;border-radius:9px;font-weight:600;font-size:13px}
.seg button.on{background:var(--ink);color:#fff}
.cal-wrap{display:grid;gap:14px}
@media (min-width:1000px){.cal-wrap{grid-template-columns:minmax(0,1.6fr) minmax(300px,1fr);align-items:start}}
.month{background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.dow{display:grid;grid-template-columns:repeat(7,1fr);font-size:11px;font-weight:700;color:var(--muted);text-align:center;padding:8px 0;border-bottom:1px solid var(--line)}
.days{display:grid;grid-template-columns:repeat(7,1fr)}
.day{border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:#fff;min-height:58px;padding:5px 3px 4px;text-align:left;display:flex;flex-direction:column;gap:2px;overflow:hidden}
.day:nth-child(7n){border-right:0}
.day .num{font-size:12px;font-weight:600;width:24px;height:24px;display:grid;place-items:center;border-radius:50%;margin:0 auto}
.day.other{background:#F8FAF6}
.day.other .num{color:#A6B4A9}
.day.today .num{background:var(--gold);font-weight:800}
.day.sel{box-shadow:inset 0 0 0 2px var(--ink)}
.day .dots{display:flex;gap:3px;justify-content:center;flex-wrap:wrap}
.day .dots i{width:6px;height:6px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.day .lbl{display:none}
@media (min-width:700px){
  .day{min-height:96px;padding:5px}
  .day .num{margin:0}
  .day .dots{display:none}
  .day .lbl{display:block;font-size:11px;font-weight:600;padding:2px 5px;border-radius:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .day .more{font-size:10px;color:var(--muted);padding-left:4px}
}
.agenda-day{margin-bottom:14px}
/* Phone calendar (26 R13) */
.pcal{background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow);padding:8px 6px 0;margin-bottom:14px;touch-action:pan-y}
.pdow{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:11px;font-weight:700;color:var(--muted);padding-bottom:2px}
.pgrid{display:grid;grid-template-columns:repeat(7,1fr);row-gap:2px}
.pd{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 0 6px;min-height:52px;font:inherit;color:var(--ink);cursor:pointer;border-radius:12px}
.pgrid.week .pd{min-height:60px}
.pd .n{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;font-size:15px;font-weight:600}
.pd.other .n{color:var(--muted);opacity:.55}
.pd.today .n{box-shadow:inset 0 0 0 2px var(--green);color:var(--green);font-weight:800}
.pd.sel .n{background:var(--ink);color:#fff;box-shadow:none}
.pdots{display:flex;gap:3px;height:7px;align-items:center}.pdots i{width:6px;height:6px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}.pdots b{font-size:9px;line-height:1;color:var(--muted)}
.pd:focus-visible{outline:3px solid var(--ink);outline-offset:-2px}
.phandle{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;border:0;border-top:1px solid var(--line);background:none;padding:9px;font:600 13px inherit;font-family:inherit;color:var(--muted);cursor:pointer;margin-top:4px}
.pday{padding-bottom:96px;touch-action:pan-y}
.pday-h{display:flex;align-items:center;gap:6px;margin:0 0 8px}
.pday-t{flex:1;min-width:0;text-align:center}.pday-t b{font-size:18px;line-height:1.25}.pday-t .tag{display:inline-block;margin-left:6px;vertical-align:2px}
.pday-t .tag{font-size:12px;font-weight:700;background:var(--green);color:#fff;border-radius:20px;padding:3px 9px}
.pwx{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 10px}.pwx span{background:var(--white);box-shadow:var(--shadow);border-radius:20px;padding:5px 11px;font-size:13px;font-weight:600}.pwx .hu{background:#E7F2FB}
.pall{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.pchip{display:inline-flex;align-items:center;gap:7px;border:0;background:var(--white);box-shadow:var(--shadow);border-radius:20px;padding:7px 12px;font:600 13.5px inherit;font-family:inherit;color:var(--ink);cursor:pointer}.pchip i{width:10px;height:10px;border-radius:50%}
.pev.past{opacity:.55}
.nowline{display:flex;align-items:center;gap:8px;margin:6px 0 8px;color:#DB2B24;font-size:12px;font-weight:700}.nowline::before{content:"";width:9px;height:9px;border-radius:50%;background:#DB2B24}.nowline::after{content:"";flex:1;height:2px;background:#DB2B24}
.padd{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;margin-top:8px;padding:12px;border:2px dashed var(--line);border-radius:14px;background:none;font:600 14px inherit;font-family:inherit;color:var(--muted);cursor:pointer}.padd svg{width:18px;height:18px}
.pempty{text-align:center}
.agenda-day h3{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:0 0 6px 4px}
.agenda-day h3.today{color:var(--green)}
.ev{display:flex;gap:10px;align-items:stretch;width:100%;border:0;background:#fff;border-radius:12px;padding:10px;text-align:left;margin-bottom:6px;box-shadow:var(--shadow)}
.ev .when{text-align:left;width:52px}
.ev .t{font-weight:700}
.ev .m{font-size:12px;color:var(--muted)}
.ev .src{font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 6px;border-radius:5px;background:var(--indigo-tint);color:#2F3E9E;margin-left:6px;vertical-align:1px}

/* ---------- bookings ---------- */
.strip{position:relative;height:44px;background:#F1F5F2;border-radius:10px;overflow:hidden;margin:6px 0 4px}
.strip .blk{position:absolute;top:6px;bottom:6px;border-radius:6px;color:#fff;font-size:11px;font-weight:700;padding:0 6px;display:flex;align-items:center;overflow:hidden;white-space:nowrap}
.strip .now{position:absolute;top:0;bottom:0;width:2px;background:var(--danger)}
.ticks{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);padding:0 2px}
.daynav{display:flex;align-items:center;gap:6px;margin-bottom:10px}
.daynav .d{font-weight:700;flex:1;text-align:center}

/* ---------- forms / modal ---------- */
.scrim{position:fixed;inset:0;background:rgba(29,51,40,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{background:var(--white);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:8px 18px calc(18px + var(--safe-b));animation:up .2s ease-out}
.sheet .grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:4px auto 10px}
.sheet h2{font-size:19px;font-weight:800;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.sheet h2 .x{margin-left:auto}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:22px;padding:18px 22px 22px}.sheet .grab{display:none}}
@keyframes up{from{transform:translateY(30px);opacity:.5}}
@keyframes fade{from{opacity:0}}
.f{margin-bottom:14px}
.f>label,.f>.lab{display:block;font-size:12px;font-weight:700;margin-bottom:6px;color:var(--ink)}
.f input[type=text],.f input[type=email],.f input[type=password],.f input[type=url],.f input[type=date],.f input[type=time],.f input[type=datetime-local],.f select,.f textarea{width:100%;border:0;border-radius:12px;padding:12px 14px;background:#F7F9F5;box-shadow:inset 0 0 0 1.5px var(--line);font-size:16px;min-height:46px}
.f textarea{min-height:80px;resize:vertical}
.f input:focus,.f select:focus,.f textarea:focus{outline:none;box-shadow:inset 0 0 0 2px var(--ink);background:#fff}
.f .hint{font-size:12px;color:var(--muted);margin-top:5px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toggle{display:flex;align-items:center;gap:10px;font-weight:600;font-size:14px;cursor:pointer}
.toggle input{width:22px;height:22px;accent-color:var(--green)}
.pick{display:flex;flex-wrap:wrap;gap:8px}
.pick label{display:inline-flex;align-items:center;gap:7px;padding:7px 12px 7px 7px;border-radius:99px;box-shadow:inset 0 0 0 1.5px var(--line);font-weight:600;font-size:13px;cursor:pointer}
.pick input{position:absolute;opacity:0;pointer-events:none}
.pick label:has(input:checked){background:var(--ink);color:#fff;box-shadow:none}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatches label{width:34px;height:34px;border-radius:50%;cursor:pointer;display:grid;place-items:center}
.swatches input{position:absolute;opacity:0}
.swatches label:has(input:checked){box-shadow:0 0 0 3px #fff,0 0 0 5px var(--ink)}
.swatches label:has(input:focus-visible){outline:2px solid var(--ink);outline-offset:4px}
.actions{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
.actions .grow{flex:1}
.err{background:var(--danger-tint);color:var(--danger);border-radius:10px;padding:10px 12px;font-size:13px;font-weight:600;margin-bottom:12px}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + var(--safe-b) + 18px);transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:12px;font-size:14px;font-weight:600;z-index:60;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:90vw;animation:up .2s}
@media (min-width:900px){.toast{bottom:28px}}

/* ---------- sign-in ---------- */
.signin{min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--gold)}
.signin .box{background:#fff;border-radius:24px;padding:28px 24px;width:100%;max-width:400px;box-shadow:0 10px 40px rgba(29,51,40,.2)}
.signin img{width:64px;height:64px;border-radius:16px;display:block;margin-bottom:14px}
.signin h1{font-size:26px;font-weight:800}
.signin p{color:var(--muted);font-size:14px}
.settings-sec h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:22px 4px 8px;font-weight:700}
.settings-sec h2:first-child{margin-top:0}
.howto summary{font-weight:700;cursor:pointer;padding:8px 0}
.howto ol{margin:4px 0 10px;padding-left:20px;font-size:13px}
.ver a{color:var(--green);font-weight:700}

/* ---------- R0.2: wordmark, help, What's new ---------- */
.brand{text-align:left;min-width:0}
.brand .wm{display:flex;flex-direction:column;align-items:flex-start;line-height:1;font-size:21px;font-weight:800;letter-spacing:-.01em}
.brand .wm small{font-size:10.5px;font-weight:600;letter-spacing:.01em;margin:3px 0 0 1px;opacity:.8;white-space:nowrap}
@media (max-width:430px){.mode-pill{display:none}}
.help-btn{flex:none;display:inline-flex;align-items:center;gap:6px;border:0;height:36px;padding:0 12px 0 5px;border-radius:99px;background:rgba(29,51,40,.12);font-weight:700;font-size:14px;color:var(--ink)}
.help-btn .q{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--gold);font-weight:800;font-size:15px}
.top .icon-btn,.mode-pill{flex:none}
.help-btn:hover{background:rgba(29,51,40,.18)}
/* R3: Sign out in the top bar */
.out-btn{flex:none;display:inline-flex;align-items:center;gap:6px;border:0;height:36px;padding:0 12px 0 10px;border-radius:99px;background:rgba(29,51,40,.12);font-weight:700;font-size:14px;color:var(--ink)}
.out-btn svg{width:18px;height:18px}
.out-btn:hover{background:rgba(29,51,40,.18)}
@media (max-width:430px){.out-btn{padding:0;width:36px;justify-content:center}.out-btn .ot{display:none}}
.tag{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:6px;background:#E3EAE2;color:var(--muted);vertical-align:2px}
.tag.gold{background:var(--gold);color:var(--ink)}
.wn-intro{position:sticky;top:-8px;background:#fff;padding-top:4px;z-index:1}
.wn{border-top:1px solid var(--line);padding:12px 0 4px}
.wn h3{font-size:16px;font-weight:800}
.wn ul{margin:8px 0;padding-left:20px;font-size:14px}
.wn li{margin-bottom:4px}
.wn .lab{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:10px 0 0}
.help-h{font-size:15px;font-weight:800;margin-top:16px}
.toc{list-style:none;padding:0;margin:10px 0 0;font-size:14px}
.toc li{display:flex;gap:10px;padding:7px 2px;border-bottom:1px dotted var(--line)}
.toc li a{flex:1;color:var(--ink);text-decoration:none;font-weight:600}
.toc li a:hover{color:var(--green);text-decoration:underline}
.toc li span{color:var(--muted);font-size:12px}
.sheet a.btn{text-decoration:none}
.pwwrap{position:relative}
.f .pwwrap input{padding-right:76px}
.pwshow{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--green);font:600 14px/1 inherit;font-family:inherit;padding:10px 12px;min-height:40px;min-width:56px;border-radius:10px;cursor:pointer}
.pwshow:hover{background:var(--green-tint)}
.pwshow:focus-visible{outline:2px solid var(--green);outline-offset:1px}
.capsnote,.signin p.capsnote{margin:6px 0 0;font-size:12px;font-weight:600;color:var(--danger)}
.capsnote[hidden]{display:none}
.pwcheck{list-style:none;padding:0;margin:8px 0 0;font-size:12px;color:var(--muted);display:grid;grid-template-columns:1fr 1fr;gap:2px 10px}
.pwcheck li.ok{color:var(--green);font-weight:600}
.signin .banner{margin:0 0 12px}

/* Netlify's free plan adds a "Powered by Netlify" badge (bottom right, about 64px tall)
   that can't be hidden. When it's there, lift the tab bar, + button and messages above it. */
.has-badge .nav{bottom:var(--badge-h)}
.has-badge .fab{bottom:calc(var(--nav-h) + var(--safe-b) + 16px + var(--badge-h))}
.has-badge .toast{bottom:calc(var(--nav-h) + var(--safe-b) + 18px + var(--badge-h))}
.has-badge main{padding-bottom:calc(var(--nav-h) + var(--safe-b) + 90px + var(--badge-h))}
.has-badge body::after{content:"";position:fixed;left:0;right:0;bottom:0;height:var(--badge-h);background:var(--white);z-index:29}
@media (min-width:900px){
  .has-badge .nav{bottom:0}
  .has-badge .fab{bottom:calc(28px + var(--badge-h))}
  .has-badge .toast{bottom:calc(28px + var(--badge-h))}
  .has-badge main{padding-bottom:calc(120px + var(--badge-h))}
  .has-badge body::after{display:none}
}
.home-ver{text-align:center;font-size:12px;color:var(--muted);margin:22px 0 0;line-height:1.9}
.home-ver a{color:var(--green);font-weight:700}
.vids{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0 4px}
.vid{border:0;background:#fff;padding:0;border-radius:12px;overflow:hidden;box-shadow:inset 0 0 0 1.5px var(--line);text-align:left;cursor:pointer}
.vid img{display:block;width:100%;aspect-ratio:9/12;object-fit:cover;object-position:top;background:var(--ivory)}
.vid span{display:block;padding:8px 10px;font-size:12px;font-weight:700;line-height:1.3}
.provs{display:flex;flex-direction:column;gap:8px;margin:6px 0 12px}
.prov{display:flex;align-items:center;gap:12px;border:0;background:#fff;box-shadow:inset 0 0 0 1.5px var(--line);border-radius:14px;padding:12px;text-align:left;min-height:62px}
.prov:hover{box-shadow:inset 0 0 0 2px var(--ink)}
.prov>span:nth-child(2){flex:1}
.prov b{display:block;font-size:15px}
.prov small{color:var(--muted);font-size:12px}
.prov svg:last-child{width:20px;height:20px;color:var(--muted)}
.pl{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:18px;flex:none}
.steps{margin:0 0 14px;padding-left:22px;font-size:14px}
.steps li{margin-bottom:8px}
.paste{display:flex;gap:8px}
.paste input{flex:1;min-width:0}
.found{background:var(--green-tint);color:var(--ink);border-radius:12px;padding:12px;font-size:14px;margin:4px 0 12px}
</style>
</head>

<div id="app"></div>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.min.js"></script>
<script src="app.js"></script>
