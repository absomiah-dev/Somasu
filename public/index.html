<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F2B84C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Somasu">
<meta name="app-version" content="26 R2 (01-11-2026)">
<title>Somasu</title>
<link rel="manifest" href="site.webmanifest">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --gold:#F2B84C; --gold-deep:#E0A12E; --gold-tint:#FBE3B8; --gold-soft:#FDF3DF;
  --ink:#083223; --muted:#5E6B64; --green:#10704E; --green-tint:#DCEFE6;
  --indigo:#5567D6; --indigo-tint:#D9DEF7; --ivory:#F3EDE0; --white:#fff;
  --line:#E7DFCC; --danger:#B3261E; --danger-tint:#FBE4E2;
  --radius:16px; --shadow:0 1px 2px rgba(8,50,35,.06),0 4px 16px rgba(8,50,35,.06);
  --nav-h:68px; --top-h:60px;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--ivory);color:var(--ink);font-family:Sora,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--green)}
h1,h2,h3{margin:0;line-height:1.2}
.hidden{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- shell ---------- */
.top{position:sticky;top:0;z-index:20;background:var(--gold);padding:calc(var(--safe-t) + 10px) 16px 10px;display:flex;align-items:center;gap:10px;min-height:var(--top-h)}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;letter-spacing:-.01em;background:none;border:0;padding:0}
.brand img{width:34px;height:34px;border-radius:9px;box-shadow:0 0 0 2px rgba(8,50,35,.12)}
.brand small{display:block;font-weight:500;font-size:11px;letter-spacing:.02em;color:var(--ink);opacity:.75;margin-top:1px}
.top .spacer{flex:1}
.mode-pill{font-size:11px;font-weight:600;background:rgba(8,50,35,.1);padding:4px 10px;border-radius:99px;white-space:nowrap}
.layout{display:flex;min-height:calc(100vh - var(--top-h))}
.side{display:none}
main{flex:1;min-width:0;padding:16px 16px calc(var(--nav-h) + var(--safe-b) + 90px);max-width:1180px;margin:0 auto;width:100%}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--white);border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + var(--safe-b));}
.nav button{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;border-radius:12px;font-size:11px;font-weight:600;color:var(--muted)}
.nav button svg{width:24px;height:24px}
.nav button.on{color:var(--ink)}
.nav button.on .ico{background:var(--gold);}
.nav .ico{display:grid;place-items:center;width:52px;height:30px;border-radius:99px;transition:background .15s}
@media (min-width:900px){
  .nav{display:none}
  .side{display:flex;flex-direction:column;gap:4px;width:230px;flex:none;padding:18px 12px;position:sticky;top:var(--top-h);height:calc(100vh - var(--top-h));border-right:1px solid var(--line);background:var(--ivory)}
  .side button{display:flex;align-items:center;gap:12px;background:none;border:0;padding:11px 14px;border-radius:12px;font-weight:600;color:var(--ink);text-align:left}
  .side button svg{width:22px;height:22px}
  .side button:hover{background:rgba(8,50,35,.05)}
  .side button.on{background:var(--gold)}
  .side .foot{margin-top:auto;font-size:11px;color:var(--muted);padding:0 14px}
  main{padding:24px 28px 120px}
}
.fab{position:fixed;right:18px;bottom:calc(var(--nav-h) + var(--safe-b) + 16px);z-index:25;width:58px;height:58px;border-radius:18px;border:0;background:var(--ink);color:var(--gold);display:grid;place-items:center;box-shadow:0 6px 20px rgba(8,50,35,.3)}
.fab svg{width:28px;height:28px}
@media (min-width:900px){.fab{bottom:28px;right:28px}}

/* ---------- common ---------- */
.page-h{display:flex;align-items:center;gap:10px;margin:2px 0 14px;flex-wrap:wrap}
.page-h h1{font-size:24px;font-weight:800;letter-spacing:-.02em}
.page-h .sub{color:var(--muted);font-size:13px;width:100%;margin-top:-6px}
.card{background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
.card h2{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px;margin-bottom:10px}
.card h2 .dot{width:9px;height:9px;border-radius:50%;background:var(--gold);flex:none}
.card h2 .more{margin-left:auto;font-size:12px;font-weight:600;background:none;border:0;color:var(--green);padding:4px}
.grid2{display:grid;gap:14px}
@media (min-width:900px){.grid2{grid-template-columns:1fr 1fr}.grid2 .card{margin-bottom:0}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:12px;padding:11px 16px;font-weight:600;background:var(--gold);color:var(--ink);min-height:44px}
.btn:hover{background:var(--gold-deep)}
.btn.dark{background:var(--ink);color:var(--white)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.ghost:hover{background:rgba(8,50,35,.04)}
.btn.danger{background:var(--danger-tint);color:var(--danger)}
.btn.sm{min-height:34px;padding:6px 12px;font-size:13px;border-radius:10px}
.btn svg{width:18px;height:18px}
.icon-btn{width:40px;height:40px;border-radius:12px;border:0;background:transparent;display:grid;place-items:center;color:var(--ink)}
.icon-btn:hover{background:rgba(8,50,35,.06)}
.icon-btn svg{width:22px;height:22px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;margin:0 -2px 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:7px;border:0;border-radius:99px;padding:8px 14px;background:var(--white);font-weight:600;font-size:13px;box-shadow:inset 0 0 0 1.5px var(--line);white-space:nowrap;min-height:38px}
.chip.on{background:var(--ink);color:var(--white);box-shadow:none}
.chip .n{font-size:11px;background:var(--gold);color:var(--ink);border-radius:99px;padding:1px 7px}
.chip .sw{width:10px;height:10px;border-radius:50%}
.chip.off{opacity:.45}
.empty{text-align:center;color:var(--muted);padding:26px 10px;font-size:14px}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}
.muted{color:var(--muted)}
.small{font-size:12px}
.av{width:26px;height:26px;border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-size:11px;font-weight:700;flex:none}
.av.lg{width:40px;height:40px;font-size:15px}
.av-stack{display:inline-flex}
.av-stack .av{width:22px;height:22px;font-size:10px;box-shadow:0 0 0 2px #fff;margin-left:-6px}
.av-stack .av:first-child{margin-left:0}
.banner{background:var(--gold-soft);border:1px solid var(--gold-tint);border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:14px;display:flex;gap:10px;align-items:flex-start}
.banner b{font-weight:700}

/* ---------- rows ---------- */
.row{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .main{flex:1;min-width:0}
.row .t{font-weight:600;overflow-wrap:anywhere}
.row .m{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.when{flex:none;width:58px;font-size:13px;font-weight:700;text-align:right}
.when small{display:block;font-weight:500;color:var(--muted);font-size:11px}
.evbar{width:4px;align-self:stretch;border-radius:4px;flex:none}

/* ---------- lists ---------- */
.addbar{display:flex;gap:8px;margin-bottom:12px}
.addbar input{flex:1;min-width:0;border:0;border-radius:14px;padding:13px 16px;background:var(--white);box-shadow:var(--shadow), inset 0 0 0 1.5px var(--line);font-size:16px}
.addbar input:focus{outline:none;box-shadow:inset 0 0 0 2px var(--ink)}
.suggest{display:flex;flex-wrap:wrap;gap:6px;margin:-2px 0 14px}
.suggest button{border:0;background:var(--gold-soft);border-radius:99px;padding:6px 12px;font-size:12px;font-weight:600;box-shadow:inset 0 0 0 1px var(--gold-tint)}
.suggest button:hover{background:var(--gold-tint)}
.cat{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:14px 4px 2px}
.cat:first-child{margin-top:0}
.item{display:flex;align-items:center;gap:12px;padding:6px 4px;border-bottom:1px solid var(--line);min-height:52px}
.item:last-child{border-bottom:0}
.tick{width:28px;height:28px;border-radius:50%;border:2px solid #C9BFA8;background:#fff;flex:none;display:grid;place-items:center;padding:0}
.tick svg{width:16px;height:16px;opacity:0}
.item.done .tick{background:var(--green);border-color:var(--green);color:#fff}
.item.done .tick svg{opacity:1}
.item .txt{flex:1;min-width:0;background:none;border:0;text-align:left;padding:6px 0}
.item .txt .t{font-weight:600;display:block;overflow-wrap:anywhere}
.item .txt .m{font-size:12px;color:var(--muted)}
.item.done .txt .t{text-decoration:line-through;color:var(--muted);font-weight:500}
.done-h{display:flex;align-items:center;gap:8px;margin-top:16px}
.done-h button.tog{background:none;border:0;font-weight:700;font-size:13px;display:flex;align-items:center;gap:6px;padding:6px 4px}
.done-h .btn{margin-left:auto}

/* ---------- calendar ---------- */
.cal-h{display:flex;align-items:center;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.cal-h h1{font-size:22px;font-weight:800;margin-right:auto;letter-spacing:-.02em}
.seg{display:inline-flex;background:var(--white);border-radius:12px;padding:3px;box-shadow:inset 0 0 0 1.5px var(--line)}
.seg button{border:0;background:none;padding:6px 12px;border-radius:9px;font-weight:600;font-size:13px}
.seg button.on{background:var(--ink);color:#fff}
.cal-wrap{display:grid;gap:14px}
@media (min-width:1000px){.cal-wrap{grid-template-columns:minmax(0,1.6fr) minmax(300px,1fr);align-items:start}}
.month{background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.dow{display:grid;grid-template-columns:repeat(7,1fr);font-size:11px;font-weight:700;color:var(--muted);text-align:center;padding:8px 0;border-bottom:1px solid var(--line)}
.days{display:grid;grid-template-columns:repeat(7,1fr)}
.day{border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:#fff;min-height:58px;padding:5px 3px 4px;text-align:left;display:flex;flex-direction:column;gap:2px;overflow:hidden}
.day:nth-child(7n){border-right:0}
.day .num{font-size:12px;font-weight:600;width:24px;height:24px;display:grid;place-items:center;border-radius:50%;margin:0 auto}
.day.other{background:#FBF9F4}
.day.other .num{color:#B5AE9E}
.day.today .num{background:var(--gold);font-weight:800}
.day.sel{box-shadow:inset 0 0 0 2px var(--ink)}
.day .dots{display:flex;gap:3px;justify-content:center;flex-wrap:wrap}
.day .dots i{width:6px;height:6px;border-radius:50%}
.day .lbl{display:none}
@media (min-width:700px){
  .day{min-height:96px;padding:5px}
  .day .num{margin:0}
  .day .dots{display:none}
  .day .lbl{display:block;font-size:11px;font-weight:600;padding:2px 5px;border-radius:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .day .more{font-size:10px;color:var(--muted);padding-left:4px}
}
.agenda-day{margin-bottom:14px}
.agenda-day h3{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:0 0 6px 4px}
.agenda-day h3.today{color:var(--green)}
.ev{display:flex;gap:10px;align-items:stretch;width:100%;border:0;background:#fff;border-radius:12px;padding:10px;text-align:left;margin-bottom:6px;box-shadow:var(--shadow)}
.ev .when{text-align:left;width:52px}
.ev .t{font-weight:700}
.ev .m{font-size:12px;color:var(--muted)}
.ev .src{font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 6px;border-radius:5px;background:var(--indigo-tint);color:#2F3E9E;margin-left:6px;vertical-align:1px}

/* ---------- bookings ---------- */
.strip{position:relative;height:44px;background:#F1F5F2;border-radius:10px;overflow:hidden;margin:6px 0 4px}
.strip .blk{position:absolute;top:6px;bottom:6px;border-radius:6px;color:#fff;font-size:11px;font-weight:700;padding:0 6px;display:flex;align-items:center;overflow:hidden;white-space:nowrap}
.strip .now{position:absolute;top:0;bottom:0;width:2px;background:var(--danger)}
.ticks{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);padding:0 2px}
.daynav{display:flex;align-items:center;gap:6px;margin-bottom:10px}
.daynav .d{font-weight:700;flex:1;text-align:center}

/* ---------- forms / modal ---------- */
.scrim{position:fixed;inset:0;background:rgba(8,50,35,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{background:var(--white);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:8px 18px calc(18px + var(--safe-b));animation:up .2s ease-out}
.sheet .grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:4px auto 10px}
.sheet h2{font-size:19px;font-weight:800;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.sheet h2 .x{margin-left:auto}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:22px;padding:18px 22px 22px}.sheet .grab{display:none}}
@keyframes up{from{transform:translateY(30px);opacity:.5}}
@keyframes fade{from{opacity:0}}
.f{margin-bottom:14px}
.f>label,.f>.lab{display:block;font-size:12px;font-weight:700;margin-bottom:6px;color:var(--ink)}
.f input[type=text],.f input[type=email],.f input[type=password],.f input[type=url],.f input[type=date],.f input[type=time],.f input[type=datetime-local],.f select,.f textarea{width:100%;border:0;border-radius:12px;padding:12px 14px;background:#FAF7F0;box-shadow:inset 0 0 0 1.5px var(--line);font-size:16px;min-height:46px}
.f textarea{min-height:80px;resize:vertical}
.f input:focus,.f select:focus,.f textarea:focus{outline:none;box-shadow:inset 0 0 0 2px var(--ink);background:#fff}
.f .hint{font-size:12px;color:var(--muted);margin-top:5px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toggle{display:flex;align-items:center;gap:10px;font-weight:600;font-size:14px;cursor:pointer}
.toggle input{width:22px;height:22px;accent-color:var(--green)}
.pick{display:flex;flex-wrap:wrap;gap:8px}
.pick label{display:inline-flex;align-items:center;gap:7px;padding:7px 12px 7px 7px;border-radius:99px;box-shadow:inset 0 0 0 1.5px var(--line);font-weight:600;font-size:13px;cursor:pointer}
.pick input{position:absolute;opacity:0;pointer-events:none}
.pick label:has(input:checked){background:var(--ink);color:#fff;box-shadow:none}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches label{width:34px;height:34px;border-radius:50%;cursor:pointer;display:grid;place-items:center}
.swatches input{position:absolute;opacity:0}
.swatches label:has(input:checked){box-shadow:0 0 0 3px #fff,0 0 0 5px var(--ink)}
.actions{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
.actions .grow{flex:1}
.err{background:var(--danger-tint);color:var(--danger);border-radius:10px;padding:10px 12px;font-size:13px;font-weight:600;margin-bottom:12px}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + var(--safe-b) + 18px);transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:12px;font-size:14px;font-weight:600;z-index:60;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:90vw;animation:up .2s}
@media (min-width:900px){.toast{bottom:28px}}

/* ---------- sign-in ---------- */
.signin{min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--gold)}
.signin .box{background:#fff;border-radius:24px;padding:28px 24px;width:100%;max-width:400px;box-shadow:0 10px 40px rgba(8,50,35,.2)}
.signin img{width:64px;height:64px;border-radius:16px;display:block;margin-bottom:14px}
.signin h1{font-size:26px;font-weight:800}
.signin p{color:var(--muted);font-size:14px}
.settings-sec h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:22px 4px 8px;font-weight:700}
.settings-sec h2:first-child{margin-top:0}
.howto summary{font-weight:700;cursor:pointer;padding:8px 0}
.howto ol{margin:4px 0 10px;padding-left:20px;font-size:13px}
.ver a{color:var(--green);font-weight:700}

/* ---------- R0.2: wordmark, help, What's new ---------- */
.brand{text-align:left;min-width:0}
.brand .wm{display:flex;flex-direction:column;align-items:flex-start;line-height:1;font-size:21px;font-weight:800;letter-spacing:-.01em}
.brand .wm small{font-size:10.5px;font-weight:600;letter-spacing:.01em;margin:3px 0 0 1px;opacity:.8;white-space:nowrap}
@media (max-width:430px){.mode-pill{display:none}}
.help-btn{flex:none;display:inline-flex;align-items:center;gap:6px;border:0;height:36px;padding:0 12px 0 5px;border-radius:99px;background:rgba(8,50,35,.12);font-weight:700;font-size:14px;color:var(--ink)}
.help-btn .q{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--gold);font-weight:800;font-size:15px}
.top .icon-btn,.mode-pill{flex:none}
.help-btn:hover{background:rgba(8,50,35,.18)}
.tag{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:6px;background:#ECE7DB;color:var(--muted);vertical-align:2px}
.tag.gold{background:var(--gold);color:var(--ink)}
.wn-intro{position:sticky;top:-8px;background:#fff;padding-top:4px;z-index:1}
.wn{border-top:1px solid var(--line);padding:12px 0 4px}
.wn h3{font-size:16px;font-weight:800}
.wn ul{margin:8px 0;padding-left:20px;font-size:14px}
.wn li{margin-bottom:4px}
.wn .lab{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:10px 0 0}
.help-h{font-size:15px;font-weight:800;margin-top:16px}
.toc{list-style:none;padding:0;margin:10px 0 0;font-size:14px}
.toc li{display:flex;gap:10px;padding:7px 2px;border-bottom:1px dotted var(--line)}
.toc li a{flex:1;color:var(--ink);text-decoration:none;font-weight:600}
.toc li a:hover{color:var(--green);text-decoration:underline}
.toc li span{color:var(--muted);font-size:12px}
.sheet a.btn{text-decoration:none}
.pwcheck{list-style:none;padding:0;margin:8px 0 0;font-size:12px;color:var(--muted);display:grid;grid-template-columns:1fr 1fr;gap:2px 10px}
.pwcheck li.ok{color:var(--green);font-weight:600}
.signin .banner{margin:0 0 12px}

/* Netlify's free plan adds a "Powered by Netlify" badge (bottom right, about 64px tall)
   that can't be hidden. When it's there, lift the tab bar, + button and messages above it. */
.has-badge .nav{bottom:var(--badge-h)}
.has-badge .fab{bottom:calc(var(--nav-h) + var(--safe-b) + 16px + var(--badge-h))}
.has-badge .toast{bottom:calc(var(--nav-h) + var(--safe-b) + 18px + var(--badge-h))}
.has-badge main{padding-bottom:calc(var(--nav-h) + var(--safe-b) + 90px + var(--badge-h))}
.has-badge body::after{content:"";position:fixed;left:0;right:0;bottom:0;height:var(--badge-h);background:var(--white);z-index:29}
@media (min-width:900px){
  .has-badge .nav{bottom:0}
  .has-badge .fab{bottom:calc(28px + var(--badge-h))}
  .has-badge .toast{bottom:calc(28px + var(--badge-h))}
  .has-badge main{padding-bottom:calc(120px + var(--badge-h))}
  .has-badge body::after{display:none}
}
.home-ver{text-align:center;font-size:12px;color:var(--muted);margin:22px 0 0;line-height:1.9}
.home-ver a{color:var(--green);font-weight:700}
.vids{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0 4px}
.vid{border:0;background:#fff;padding:0;border-radius:12px;overflow:hidden;box-shadow:inset 0 0 0 1.5px var(--line);text-align:left;cursor:pointer}
.vid img{display:block;width:100%;aspect-ratio:9/12;object-fit:cover;object-position:top;background:var(--ivory)}
.vid span{display:block;padding:8px 10px;font-size:12px;font-weight:700;line-height:1.3}
.provs{display:flex;flex-direction:column;gap:8px;margin:6px 0 12px}
.prov{display:flex;align-items:center;gap:12px;border:0;background:#fff;box-shadow:inset 0 0 0 1.5px var(--line);border-radius:14px;padding:12px;text-align:left;min-height:62px}
.prov:hover{box-shadow:inset 0 0 0 2px var(--ink)}
.prov>span:nth-child(2){flex:1}
.prov b{display:block;font-size:15px}
.prov small{color:var(--muted);font-size:12px}
.prov svg:last-child{width:20px;height:20px;color:var(--muted)}
.pl{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:18px;flex:none}
.steps{margin:0 0 14px;padding-left:22px;font-size:14px}
.steps li{margin-bottom:8px}
.paste{display:flex;gap:8px}
.paste input{flex:1;min-width:0}
.found{background:var(--green-tint);color:var(--ink);border-radius:12px;padding:12px;font-size:14px;margin:4px 0 12px}
</style>
